name: Release

on:
  push:
    tags:
      - 'v*'
  # タグを push できない環境（スマホ等）からのリリース用。
  # main の manifest.json のバージョンでタグと Release を作成する。
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'
      - name: Resolve tag
        id: tag
        run: |
          VERSION="v$(node -p "require('./public/manifest.json').version")"
          if [ "${{ github.event_name }}" = "push" ] && [ "${{ github.ref_name }}" != "$VERSION" ]; then
            echo "::error::Tag ${{ github.ref_name }} does not match manifest version $VERSION"
            exit 1
          fi
          echo "name=$VERSION" >> "$GITHUB_OUTPUT"
      - run: npm ci
      - run: npm run build
      - name: Create zip
        run: |
          cd dist
          zip -r ../youtube-voicevox-${{ steps.tag.outputs.name }}.zip .
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          target_commitish: ${{ github.sha }}
          files: youtube-voicevox-*.zip
